# Every branch: check the code, build the binaries, publish an image.
#
# The kernel is compiled once and passed down as an artifact; otherwise the
# build script compiles it again in every job below.
#
# One job per target OS. darwin goes on a Mac: `wgpu` links Apple frameworks
# that exist in no other SDK, so a Linux runner cannot produce it.

name: CI

on:
  # Only main. A branch is built through its pull request, which tests the
  # result of merging it rather than the branch on its own. A branch with no
  # pull request is not built, which is the cost of this arrangement.
  push:
    branches: [main]
  # `labeled` is what lets a maintainer start a run on somebody else's pull
  # request. Without the label nothing below runs for a fork.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# One run for each branch or pull request. A new push cancels the run it
# replaces, so an abandoned one stops spending a runner and stops leaving
# artifacts behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing starts until this passes.
  #
  # A push to main passes. A pull request from a branch of this repository
  # passes, because only somebody with write access can push such a branch. A
  # pull request from a fork passes only with the label.
  #
  # Labels need the triage role or above, which an outside contributor does not
  # have, so only a maintainer can start a run for a fork.
  gate:
    name: cleared to run
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    steps:
      - run: echo "cleared"

  kernel:
    name: GPU kernel
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Nightly and pinned: the `ptx-kernel` ABI and this architecture's inline
      # assembly are unstable. Version in cuda-kernel/rust-toolchain.toml.
      - name: The kernel's toolchain
        working-directory: cuda-kernel
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cuda-kernel

      - name: Compile to PTX
        working-directory: cuda-kernel
        run: cargo build --release --target nvptx64-nvidia-cuda

      # Two properties a kernel change can lose silently: the widening multiply
      # must reach the PTX, and nothing may spill — a stack frame puts the point
      # in off-chip memory and costs a third of the throughput.
      - name: It carries the right instructions and spills nothing
        working-directory: cuda-kernel
        run: |
          set -euo pipefail
          ptx=target/nvptx64-nvidia-cuda/release/ogkernel.ptx
          test -s "$ptx"
          echo "widening multiplies: $(grep -c 'mul.wide.u32\|mad.wide.u32' "$ptx")"
          for k in chain_steps chain_reduce; do
            spills=$(awk "/\\.visible \\.entry $k/,/^}/" "$ptx" \
              | grep -c 'ld.local\|st.local' || true)
            echo "local accesses in $k: $spills"
            test "$spills" -le 64
          done

      - uses: actions/upload-artifact@v7
        with:
          name: cuda-kernel-ptx
          if-no-files-found: error
          retention-days: 7
          path: cuda-kernel/target/nvptx64-nvidia-cuda/release/ogkernel.ptx

  check:
    name: check on ${{ matrix.os }}
    # Natively on each platform: the only way to exercise `cfg(windows)` and to
    # catch a lint that fires only under `cfg(target_arch = "x86_64")`.
    needs: kernel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v8
        with:
          name: cuda-kernel-ptx
          path: kernel

      # The build script takes this instead of compiling the kernel, so nothing
      # here needs nightly. `$GITHUB_WORKSPACE` and not `$PWD`: bash on the
      # Windows runner reports `/d/a/...`, which cargo cannot open.
      - name: Point the build at the kernel
        shell: bash
        run: echo "ONION_GEN_KERNEL_PTX=$GITHUB_WORKSPACE/kernel/ogkernel.ptx" >> "$GITHUB_ENV"

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --release -- -D warnings

      - name: Tests
        run: cargo test --release

  linux:
    name: binaries for linux
    needs: kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v8
        with:
          name: cuda-kernel-ptx
          path: kernel

      - name: Point the build at the kernel
        run: echo "ONION_GEN_KERNEL_PTX=$GITHUB_WORKSPACE/kernel/ogkernel.ptx" >> "$GITHUB_ENV"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # Prebuilt: `cargo install` compiles it from source, once per job.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4

      # Named for the platform they run on, not the triple that produced them.
      # `.2.28` is the oldest glibc they will run against: RHEL 8 and its
      # rebuilds, supported to May 2029.
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {  # <rust triple> <output name>
            echo "::group::$2"
            cargo zigbuild --release --target "$1"
            triple="${1%%.*}"
            src="target/${triple}/release/onion-gen"
            [ -f "$src" ] || src="${src}.exe"
            cp "$src" "dist/$2"
            echo "::endgroup::"
          }
          build x86_64-unknown-linux-gnu.2.28   onion-gen-linux-amd64
          build aarch64-unknown-linux-gnu.2.28  onion-gen-linux-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-linux
          if-no-files-found: error
          retention-days: 7
          path: dist/*

  windows:
    name: binaries for windows
    needs: kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu, aarch64-pc-windows-gnullvm

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v8
        with:
          name: cuda-kernel-ptx
          path: kernel

      - name: Point the build at the kernel
        run: echo "ONION_GEN_KERNEL_PTX=$GITHUB_WORKSPACE/kernel/ogkernel.ptx" >> "$GITHUB_ENV"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # Prebuilt: `cargo install` compiles it from source, once per job.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {  # <rust triple> <output name>
            echo "::group::$2"
            cargo zigbuild --release --target "$1"
            triple="${1%%.*}"
            src="target/${triple}/release/onion-gen"
            [ -f "$src" ] || src="${src}.exe"
            cp "$src" "dist/$2"
            echo "::endgroup::"
          }
          build x86_64-pc-windows-gnu       onion-gen-windows-amd64.exe
          build aarch64-pc-windows-gnullvm  onion-gen-windows-arm64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-windows
          if-no-files-found: error
          retention-days: 7
          path: dist/*

  macos:
    name: binaries for macos
    # On a Mac, not through zig: `wgpu` links Apple frameworks found only in
    # the macOS SDK.
    needs: kernel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v8
        with:
          name: cuda-kernel-ptx
          path: kernel

      - name: Point the build at the kernel
        run: echo "ONION_GEN_KERNEL_PTX=$GITHUB_WORKSPACE/kernel/ogkernel.ptx" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          for pair in "x86_64-apple-darwin amd64" "aarch64-apple-darwin arm64"; do
            set -- $pair
            echo "::group::$2"
            cargo build --release --target "$1"
            cp "target/$1/release/onion-gen" "dist/onion-gen-darwin-$2"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-macos
          if-no-files-found: error
          retention-days: 7
          path: dist/*

  checksums:
    name: one set of binaries
    # The six files meet here so one `SHA256SUMS` covers all of them. Behind
    # `check` as well: a red pipeline should not hand out a set of binaries
    # that looks ready. The builds themselves still run beside the checks.
    needs: [check, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: onion-gen-binaries
          if-no-files-found: error
          retention-days: 7
          path: dist/*

  image:
    name: container image
    # Only the linux binaries and the checks: the image is packed from files
    # that already exist, so it waits for nothing else.
    needs: [check, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the signature: cosign trades a short-lived OIDC token for a
      # certificate, so there is no key to hold.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Pinned to 2.x: cosign 3 signs in the new bundle format by default, which
      # a 2.x client cannot verify. A 2.x signature verifies under both.
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v2.6.5

      # A fork's pull request has no write token: it builds and stops there.
      - name: Log in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only main publishes, so in practice this is `main`, `latest` and the
      # commit. The pull-request tag is computed but never pushed: the step
      # below publishes on a push alone.
      - name: What to tag it
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: actions/download-artifact@v8
        with:
          name: binaries-linux
          path: dist

      - name: What goes in
        run: |
          chmod +x dist/onion-gen-linux-amd64 dist/onion-gen-linux-arm64
          ls -l dist/onion-gen-linux-*

      # Dockerfile.dist packs the binaries above. No layer cache: a base plus
      # two copies carries nothing worth keeping.
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dist
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # By digest, not by tag: every tag points at the same index, and a tag
      # can be moved later.
      - name: Sign it
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
