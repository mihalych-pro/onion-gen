# A tag produces a release: six binaries, their checksums, and an image.
#

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: the tag matches the crate
    # First, and everything waits on it: a tag that disagrees with Cargo.toml
    # ships a binary whose `--version` contradicts the release it came in, and
    # nothing downstream reads Cargo.toml to notice.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare
        run: |
          set -euo pipefail
          crate=$(awk -F'"' '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
          tag="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $crate"
          echo "tag:        $tag"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml $crate"
            exit 1
          fi

  kernel:
    name: GPU kernel
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The kernel's toolchain
        working-directory: cuda-kernel
        run: rustup toolchain install

      - name: Compile to PTX
        working-directory: cuda-kernel
        run: cargo build --release --target nvptx64-nvidia-cuda

      - uses: actions/upload-artifact@v7
        with:
          name: cuda-kernel-ptx
          if-no-files-found: error
          retention-days: 7
          path: cuda-kernel/target/nvptx64-nvidia-cuda/release/ogkernel.ptx

  linux:
    name: binaries for linux ${{ matrix.arch }}
    # One target in each job. They share nothing — a different triple means a
    # different build of every dependency — so running them apart costs
    # nothing and finishes in half the time.
    needs: kernel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            triple: x86_64-unknown-linux-gnu
            floor: ".2.28"
            out: onion-gen-linux-amd64
          - arch: arm64
            triple: aarch64-unknown-linux-gnu
            floor: ".2.28"
            out: onion-gen-linux-arm64
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v8
        with:
          name: cuda-kernel-ptx
          path: kernel

      - name: Point the build at the kernel
        run: echo "ONION_GEN_KERNEL_PTX=$GITHUB_WORKSPACE/kernel/ogkernel.ptx" >> "$GITHUB_ENV"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # Prebuilt: `cargo install` compiles it from source, once per job.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4

      # Named for the platform they run on, not the triple that produced them.
      # `.2.28` is the oldest glibc they will run against: RHEL 8 and its
      # rebuilds, supported to May 2029.
      - name: Build
        env:
          TRIPLE: ${{ matrix.triple }}
          FLOOR: ${{ matrix.floor }}
          OUT: ${{ matrix.out }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo zigbuild --release --target "${TRIPLE}${FLOOR}"
          src="target/$TRIPLE/release/onion-gen"
          [ -f "$src" ] || src="${src}.exe"
          cp "$src" "dist/$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.out }}
          if-no-files-found: error
          retention-days: 7
          path: dist/*

  windows:
    name: binaries for windows ${{ matrix.arch }}
    # One target in each job. They share nothing — a different triple means a
    # different build of every dependency — so running them apart costs
    # nothing and finishes in half the time.
    needs: kernel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            triple: x86_64-pc-windows-gnu
            floor: ""
            out: onion-gen-windows-amd64.exe
          - arch: arm64
            triple: aarch64-pc-windows-gnullvm
            floor: ""
            out: onion-gen-windows-arm64.exe
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v8
        with:
          name: cuda-kernel-ptx
          path: kernel

      - name: Point the build at the kernel
        run: echo "ONION_GEN_KERNEL_PTX=$GITHUB_WORKSPACE/kernel/ogkernel.ptx" >> "$GITHUB_ENV"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # Prebuilt: `cargo install` compiles it from source, once per job.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4

      - name: Build
        env:
          TRIPLE: ${{ matrix.triple }}
          FLOOR: ${{ matrix.floor }}
          OUT: ${{ matrix.out }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo zigbuild --release --target "${TRIPLE}${FLOOR}"
          src="target/$TRIPLE/release/onion-gen"
          [ -f "$src" ] || src="${src}.exe"
          cp "$src" "dist/$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.out }}
          if-no-files-found: error
          retention-days: 7
          path: dist/*

  macos:
    name: binaries for macos ${{ matrix.arch }}
    # On a Mac, not through zig: `wgpu` links Apple frameworks found only in
    # the macOS SDK. One target in each job, as above.
    needs: kernel
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            triple: x86_64-apple-darwin
            out: onion-gen-darwin-amd64
          - arch: arm64
            triple: aarch64-apple-darwin
            out: onion-gen-darwin-arm64
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v8
        with:
          name: cuda-kernel-ptx
          path: kernel

      - name: Point the build at the kernel
        run: echo "ONION_GEN_KERNEL_PTX=$GITHUB_WORKSPACE/kernel/ogkernel.ptx" >> "$GITHUB_ENV"

      - name: Build
        env:
          TRIPLE: ${{ matrix.triple }}
          OUT: ${{ matrix.out }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo build --release --target "$TRIPLE"
          cp "target/$TRIPLE/release/onion-gen" "dist/$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.out }}
          if-no-files-found: error
          retention-days: 7
          path: dist/*

  publish:
    name: the release itself
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      # Whole history: the notes are the commits since the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          # Both shapes, because they answer different questions. `SHA256SUMS`
          # checks the whole set in one command. A `.sha256` beside each binary
          # checks that one binary, which is what somebody who downloaded one
          # file actually wants: `sha256sum -c` on the list would otherwise
          # complain about the five files they did not take.
          #
          # The per-file ones are split out of the list rather than hashed
          # again, so the two cannot disagree.
          sha256sum onion-gen-* > SHA256SUMS
          while read -r hash name; do
            printf '%s  %s\n' "$hash" "$name" > "$name.sha256"
          done < SHA256SUMS
          cat SHA256SUMS

      # Not the automatic notes: those list pull requests, and this project
      # commits straight to main.
      - name: What changed
        id: notes
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 --exclude="$GITHUB_REF_NAME" 2>/dev/null || true)
          {
            if [ -n "$previous" ]; then
              echo "### Changes since $previous"
              echo
              git log --no-merges --pretty='- %s (%h)' "$previous..$GITHUB_REF_NAME"
              echo
              echo "[Full diff](${{ github.server_url }}/${{ github.repository }}/compare/$previous...$GITHUB_REF_NAME)"
            else
              echo "### The first release"
              echo
              git log --no-merges --pretty='- %s (%h)' "$GITHUB_REF_NAME" | head -50
            fi
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          cat notes.md

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes.md
          fail_on_unmatched_files: true

  image:
    name: container image
    # After the binaries: a tag that cannot build must not leave a published
    # image pointing at a release that does not exist.
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the signature: cosign trades a short-lived OIDC token for a
      # certificate, so there is no key to hold.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Pinned to 2.x: cosign 3 signs in the new bundle format by default, which
      # a 2.x client cannot verify. A 2.x signature verifies under both.
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `1.2.3`, `1.2`, `1` and `latest`. The short ones let a deployment follow
      # patches without naming each; the leading `v` is dropped.
      - name: What to tag it
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-onion-gen-linux-*
          merge-multiple: true
          path: dist

      - name: What goes in
        run: |
          chmod +x dist/onion-gen-linux-amd64 dist/onion-gen-linux-arm64
          ls -l dist/onion-gen-linux-*

      # Dockerfile.dist packs the binaries above. No layer cache: a base plus
      # two copies carries nothing worth keeping.
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # By digest, not by tag: all four tags point at the same index, and a tag
      # can be moved later.
      - name: Sign it
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
