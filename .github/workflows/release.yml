# A tag produces a release: six binaries, their checksums, and an image.
#
# Same shape as CI, with one difference: nothing is published until every
# binary exists. A release missing a platform is worse than a late one.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  kernel:
    name: GPU kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The kernel's toolchain
        working-directory: cuda-kernel
        run: rustup toolchain install

      - name: Compile to PTX
        working-directory: cuda-kernel
        run: cargo build --release --target nvptx64-nvidia-cuda

      - uses: actions/upload-artifact@v4
        with:
          name: cuda-kernel-ptx
          if-no-files-found: error
          path: cuda-kernel/target/nvptx64-nvidia-cuda/release/ogkernel.ptx

  linux:
    name: binaries for linux
    needs: kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: cuda-kernel-ptx
          path: kernel

      - name: Point the build at the kernel
        run: echo "ONION_GEN_KERNEL_PTX=$GITHUB_WORKSPACE/kernel/ogkernel.ptx" >> "$GITHUB_ENV"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # Prebuilt: `cargo install` compiles it from source, once per job.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4

      # Named for the platform they run on, not the triple that produced them.
      # `.2.28` is the oldest glibc they will run against: RHEL 8 and its
      # rebuilds, supported to May 2029.
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {  # <rust triple> <output name>
            echo "::group::$2"
            cargo zigbuild --release --target "$1"
            triple="${1%%.*}"
            src="target/${triple}/release/onion-gen"
            [ -f "$src" ] || src="${src}.exe"
            cp "$src" "dist/$2"
            echo "::endgroup::"
          }
          build x86_64-unknown-linux-gnu.2.28   onion-gen-linux-amd64
          build aarch64-unknown-linux-gnu.2.28  onion-gen-linux-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux
          if-no-files-found: error
          path: dist/*

  windows:
    name: binaries for windows
    needs: kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu, aarch64-pc-windows-gnullvm

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: cuda-kernel-ptx
          path: kernel

      - name: Point the build at the kernel
        run: echo "ONION_GEN_KERNEL_PTX=$GITHUB_WORKSPACE/kernel/ogkernel.ptx" >> "$GITHUB_ENV"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # Prebuilt: `cargo install` compiles it from source, once per job.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {  # <rust triple> <output name>
            echo "::group::$2"
            cargo zigbuild --release --target "$1"
            triple="${1%%.*}"
            src="target/${triple}/release/onion-gen"
            [ -f "$src" ] || src="${src}.exe"
            cp "$src" "dist/$2"
            echo "::endgroup::"
          }
          build x86_64-pc-windows-gnu       onion-gen-windows-amd64.exe
          build aarch64-pc-windows-gnullvm  onion-gen-windows-arm64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-windows
          if-no-files-found: error
          path: dist/*

  macos:
    name: binaries for macos
    needs: kernel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - uses: actions/download-artifact@v4
        with:
          name: cuda-kernel-ptx
          path: kernel

      - name: Point the build at the kernel
        run: echo "ONION_GEN_KERNEL_PTX=$GITHUB_WORKSPACE/kernel/ogkernel.ptx" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          for pair in "x86_64-apple-darwin amd64" "aarch64-apple-darwin arm64"; do
            set -- $pair
            echo "::group::$2"
            cargo build --release --target "$1"
            cp "target/$1/release/onion-gen" "dist/onion-gen-darwin-$2"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-macos
          if-no-files-found: error
          path: dist/*

  publish:
    name: the release itself
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      # Whole history: the notes are the commits since the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # Not the automatic notes: those list pull requests, and this project
      # commits straight to main.
      - name: What changed
        id: notes
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 --exclude="$GITHUB_REF_NAME" 2>/dev/null || true)
          {
            if [ -n "$previous" ]; then
              echo "### Changes since $previous"
              echo
              git log --no-merges --pretty='- %s (%h)' "$previous..$GITHUB_REF_NAME"
              echo
              echo "[Full diff](${{ github.server_url }}/${{ github.repository }}/compare/$previous...$GITHUB_REF_NAME)"
            else
              echo "### The first release"
              echo
              git log --no-merges --pretty='- %s (%h)' "$GITHUB_REF_NAME" | head -50
            fi
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          cat notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          fail_on_unmatched_files: true

  image:
    name: container image
    # After the binaries: a tag that cannot build must not leave a published
    # image pointing at a release that does not exist.
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the signature: cosign trades a short-lived OIDC token for a
      # certificate, so there is no key to hold.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Pinned to 2.x: cosign 3 signs in the new bundle format by default, which
      # a 2.x client cannot verify. A 2.x signature verifies under both.
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.6.5

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `1.2.3`, `1.2`, `1` and `latest`. The short ones let a deployment follow
      # patches without naming each; the leading `v` is dropped.
      - name: What to tag it
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: actions/download-artifact@v4
        with:
          name: binaries-linux
          path: dist

      - name: What goes in
        run: |
          chmod +x dist/onion-gen-linux-amd64 dist/onion-gen-linux-arm64
          ls -l dist/onion-gen-linux-*

      # Dockerfile.dist packs the binaries above. No layer cache: a base plus
      # two copies carries nothing worth keeping.
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # By digest, not by tag: all four tags point at the same index, and a tag
      # can be moved later.
      - name: Sign it
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
