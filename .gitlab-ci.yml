# The same shape as .github/workflows/ci.yml and release.yml, in one file.
#
# Shared runners are Linux, so the tests run on Linux only; zig cross-builds all
# six platforms from there. Native Windows and macOS runs live in the GitHub
# workflow.
#
# The kernel is compiled once and passed down as an artifact. The image is
# packed from the binaries already built — `Dockerfile.dist` — with rootless
# BuildKit rather than docker-in-docker: no privileged container, no socket.

stages: [kernel, check, build, publish]

# Without this a branch with an open merge request runs two pipelines per push.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  # Where the kernel job leaves its PTX, and where the rest pick it up.
  KERNEL_PTX: $CI_PROJECT_DIR/cuda-kernel/target/nvptx64-nvidia-cuda/release/ogkernel.ptx

default:
  # Pinned, not `latest`: zig and cargo-zigbuild come with this image, and the
  # pair has broken half the targets before. Its Rust is older than the manifest
  # asks for, so every job switches to stable first.
  image: ghcr.io/rust-cross/cargo-zigbuild:0.23.4
  before_script:
    - rustup toolchain install stable --profile minimal --component clippy,rustfmt
    - rustup default stable
    - rustc --version
  cache:
    # One cache per job: under a shared key, jobs running at once each upload
    # the whole thing and the last to finish wins.
    key:
      files: [Cargo.lock]
      prefix: $CI_JOB_NAME_SLUG
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/

# ------------------------------------------------------------------ kernel ---

# A tag that disagrees with Cargo.toml ships a binary whose `--version`
# contradicts the release it came in, and nothing downstream reads Cargo.toml.
version:
  stage: kernel
  rules:
    - if: $CI_COMMIT_TAG
  image: alpine:3.22
  before_script: []
  cache: []
  script:
    - |
      set -eu
      crate=$(awk -F'"' '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
      tag="${CI_COMMIT_TAG#v}"
      echo "Cargo.toml: $crate"
      echo "tag:        $tag"
      test "$crate" = "$tag"


kernel:
  stage: kernel
  # Nightly and pinned: the `ptx-kernel` ABI and this architecture's inline
  # assembly are unstable. Version in cuda-kernel/rust-toolchain.toml.
  before_script:
    - (cd cuda-kernel && rustup toolchain install)
  # The only job that caches this directory; elsewhere it would be a stale copy
  # of the file the artifact replaces.
  cache:
    key:
      files: [Cargo.lock]
      prefix: $CI_JOB_NAME_SLUG
    paths:
      - .cargo/registry/
      - .cargo/git/
      - cuda-kernel/target/
  script:
    - cd cuda-kernel
    - cargo build --release --target nvptx64-nvidia-cuda
    # Two properties a kernel change can lose silently: the widening multiply
    # must reach the PTX, and nothing may spill — a stack frame puts the point
    # in off-chip memory and costs a third of the throughput.
    - |
      set -euo pipefail
      ptx=target/nvptx64-nvidia-cuda/release/ogkernel.ptx
      test -s "$ptx"
      echo "widening multiplies: $(grep -c 'mul.wide.u32\|mad.wide.u32' "$ptx")"
      for k in chain_steps chain_reduce; do
        spills=$(awk "/\\.visible \\.entry $k/,/^}/" "$ptx" | grep -c 'ld.local\|st.local' || true)
        echo "local accesses in $k: $spills"
        test "$spills" -le 64
      done
  artifacts:
    name: onion-gen-ptx
    expire_in: 1 week
    paths:
      - cuda-kernel/target/nvptx64-nvidia-cuda/release/*.ptx

# ------------------------------------------------------------------- check ---

check:
  stage: check
  needs: [kernel]
  # The build script takes the PTX instead of compiling it, so no nightly here.
  variables:
    ONION_GEN_KERNEL_PTX: $KERNEL_PTX
  script:
    - test -s "$ONION_GEN_KERNEL_PTX"
    - cargo fmt --check
    - cargo clippy --all-targets --release -- -D warnings
    - cargo test --release

# ------------------------------------------------------------------- build ---

# One job per target OS: a failure names the platform, the three run at once,
# and the image waits only for linux.
#
# All cross-compile from the same Linux runner, macOS included: the
# `cargo-zigbuild` image carries the macOS SDK stubs `wgpu` needs. A bare runner
# does not, which is why GitHub builds darwin on a Mac.
.cross:
  stage: build
  # `needs` rather than the stage order: they run beside `check`, not after it.
  needs: [kernel]
  variables:
    ONION_GEN_KERNEL_PTX: $KERNEL_PTX
  artifacts:
    name: onion-gen-$CI_JOB_NAME
    expire_in: 1 week
    paths:
      - dist/

# Named for the platform they run on, not the triple that produced them.
.build-helper: &build-helper |
  set -euo pipefail
  test -s "$ONION_GEN_KERNEL_PTX"
  mkdir -p dist
  build() {  # <rust triple> <output name>
    cargo zigbuild --release --target "$1"
    triple="${1%%.*}"
    src="target/${triple}/release/onion-gen"
    [ -f "$src" ] || src="${src}.exe"
    cp "$src" "dist/$2"
  }

linux:
  extends: .cross
  script:
    - rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
    - *build-helper
    # `.2.28`: the oldest glibc these run against — RHEL 8 and its rebuilds,
    # supported to May 2029.
    - |
      build x86_64-unknown-linux-gnu.2.28   onion-gen-linux-amd64
      build aarch64-unknown-linux-gnu.2.28  onion-gen-linux-arm64

windows:
  extends: .cross
  script:
    - rustup target add x86_64-pc-windows-gnu aarch64-pc-windows-gnullvm
    - *build-helper
    - |
      build x86_64-pc-windows-gnu       onion-gen-windows-amd64.exe
      build aarch64-pc-windows-gnullvm  onion-gen-windows-arm64.exe

macos:
  extends: .cross
  script:
    - rustup target add x86_64-apple-darwin aarch64-apple-darwin
    - *build-helper
    - |
      build x86_64-apple-darwin   onion-gen-darwin-amd64
      build aarch64-apple-darwin  onion-gen-darwin-arm64

# ----------------------------------------------------------------- publish ---

container:
  stage: publish
  # Only the linux binaries and the checks: the image is packed from files that
  # already exist, so it waits for neither the windows nor the macOS build.
  needs:
    - job: check
      artifacts: false
    - job: linux
    - job: version
      optional: true
  # Rootless BuildKit, as GitLab documents it. The entrypoint is dropped: the
  # image's own one starts the daemon and never returns.
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  before_script: []
  cache: []
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  script:
    # busybox sh here, not bash: POSIX only below.
    - |
      set -eu
      mkdir -p "$HOME/.docker"
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}\n' \
        "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
        > "$HOME/.docker/config.json"
    - |
      set -eu
      chmod +x dist/onion-gen-linux-amd64 dist/onion-gen-linux-arm64
      ls -l dist/onion-gen-linux-*
    # The tags, by what produced the pipeline:
    #
    #   a tag v1.2.3     ->  1.2.3, 1.2, 1, latest
    #   default branch   ->  <branch>, <sha>, latest
    #   any other branch ->  <branch>, <sha>
    #
    # The short tags let a deployment follow patches without naming each. Only
    # the default branch or a release moves `latest`.
    - |
      set -eu
      img="$CI_REGISTRY_IMAGE"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        v="${CI_COMMIT_TAG#v}"
        major="${v%%.*}"
        minor="${v#*.}"; minor="${minor%%.*}"
        names="$img:$v,$img:$major.$minor,$img:$major,$img:latest"
      elif [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
        names="$img:$CI_COMMIT_REF_SLUG,$img:$CI_COMMIT_SHA,$img:latest"
      else
        names="$img:$CI_COMMIT_REF_SLUG,$img:$CI_COMMIT_SHA"
      fi
      # A merge request builds and stops there.
      if [ "${CI_PIPELINE_SOURCE:-}" = "merge_request_event" ]; then
        push=false
      else
        push=true
      fi
      echo "tags: $names"
      echo "push: $push"
      # Dockerfile.dist packs what the job above built: nothing compiles, so no
      # layer cache. Both architectures come off one amd64 runner without
      # emulation — the published stage only copies files in.
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=Dockerfile.dist \
        --opt platform=linux/amd64,linux/arm64 \
        --output "type=image,\"name=$names\",push=$push" \
        --metadata-file metadata.json
      # What the signing job needs: the index every tag above points at. A
      # merge request pushed nothing, but the file must exist for the report.
      : > image.env
      if [ "$push" = true ]; then
        digest=$(sed -n 's/.*"containerimage.digest"[^"]*"\([^"]*\)".*/\1/p' metadata.json)
        test -n "$digest"
        echo "IMAGE_REF=$img@$digest" > image.env
      fi
      cat image.env
  artifacts:
    reports:
      dotenv: image.env

sign:
  stage: publish
  needs: [container]
  # cosign's own image is distroless and has no shell, which GitLab needs, so
  # the binary is fetched and checked here.
  #
  # Pinned to 2.x: cosign 3 signs in the new bundle format by default, which a
  # 2.x client cannot verify. A 2.x signature verifies under both.
  image: alpine:3.22
  before_script: []
  cache: []
  variables:
    GIT_STRATEGY: none
    COSIGN_VERSION: v2.6.5
    COSIGN_SHA256: c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644
  # Keyless where it can be: a short-lived token buys a certificate, and the
  # signature records the pipeline and commit. No key to leak.
  #
  # Fulcio trusts gitlab.com only, so a self-managed instance signs with a key:
  # set COSIGN_PRIVATE_KEY and COSIGN_PASSWORD as masked variables. With
  # neither, the job is skipped rather than failing the pipeline.
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $COSIGN_PRIVATE_KEY
    - if: $CI_SERVER_HOST == "gitlab.com"
    - when: never
  script:
    - apk add --no-cache curl
    - |
      set -eu
      curl -fsSL --retry 3 -o /usr/local/bin/cosign \
        "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
      echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
      chmod +x /usr/local/bin/cosign
    - cosign login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # By digest, not by tag: a tag can be moved onto another image later.
    - |
      set -eu
      if [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
        printf '%s' "$COSIGN_PRIVATE_KEY" > /tmp/cosign.key
        cosign sign --yes --key /tmp/cosign.key "$IMAGE_REF"
        rm -f /tmp/cosign.key
      else
        cosign sign --yes "$IMAGE_REF"
      fi

# The six files meet here so one `SHA256SUMS` covers all of them. Behind
# `check` as well: a red pipeline should not hand out a set of binaries that
# looks ready.
checksums:
  stage: publish
  needs:
    - job: check
      artifacts: false
    - job: linux
    - job: windows
    - job: macos
  image: alpine:3.22
  before_script: []
  cache: []
  variables:
    GIT_STRATEGY: none
  script:
    - |
      set -eu
      cd dist
      # Both shapes: `SHA256SUMS` checks the whole set, a `.sha256` beside each
      # binary checks that one. The per-file ones are split out of the list
      # rather than hashed again, so the two cannot disagree.
      sha256sum onion-gen-* > SHA256SUMS
      while read -r hash name; do
        printf '%s  %s\n' "$hash" "$name" > "$name.sha256"
      done < SHA256SUMS
      cat SHA256SUMS
  artifacts:
    name: onion-gen-binaries
    expire_in: 1 week
    paths:
      - dist/

# Release files outlive the pipeline's artefacts, so they go to the package
# registry rather than a job that is cleaned up in a week.
release-assets:
  stage: publish
  needs: [checksums, version]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  image: alpine:3.22
  before_script: []
  cache: []
  variables:
    # The notes are the commits since the previous tag; a shallow clone cannot
    # see them.
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git curl
    - |
      set -eu
      ver="${CI_COMMIT_TAG#v}"
      base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/onion-gen/$ver"
      for f in dist/*; do
        n=$(basename "$f")
        curl -fsS --retry 3 --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$base/$n"
        echo "uploaded $n"
      done
      echo "VERSION=$ver" > release.env
    - |
      set -eu
      prev=$(git describe --tags --abbrev=0 --exclude "$CI_COMMIT_TAG" 2>/dev/null || true)
      {
        if [ -n "$prev" ]; then
          echo "### Changes since $prev"
          echo
          git log --no-merges --pretty='- %s (%h)' "$prev..$CI_COMMIT_TAG"
          echo
          echo "[Full diff]($CI_PROJECT_URL/-/compare/$prev...$CI_COMMIT_TAG)"
        else
          echo "### The first release"
          echo
          git log --no-merges --pretty='- %s (%h)' "$CI_COMMIT_TAG" | head -50
        fi
        echo
        echo "### Checksums"
        echo
        echo '```'
        cat dist/SHA256SUMS
        echo '```'
      } > notes.md
      cat notes.md
  artifacts:
    expire_in: 1 week
    paths:
      - notes.md
    reports:
      dotenv: release.env

tagged-release:
  stage: publish
  needs: [release-assets]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  cache: []
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    # A path, not the text: release-cli reads the file left by the job above.
    description: notes.md
    assets:
      links:
        - name: onion-gen-linux-amd64
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/onion-gen/$VERSION/onion-gen-linux-amd64
        - name: onion-gen-linux-amd64.sha256
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/onion-gen/$VERSION/onion-gen-linux-amd64.sha256
        - name: onion-gen-linux-arm64
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/onion-gen/$VERSION/onion-gen-linux-arm64
        - name: onion-gen-linux-arm64.sha256
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/onion-gen/$VERSION/onion-gen-linux-arm64.sha256
        - name: onion-gen-darwin-amd64
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/onion-gen/$VERSION/onion-gen-darwin-amd64
        - name: onion-gen-darwin-amd64.sha256
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/onion-gen/$VERSION/onion-gen-darwin-amd64.sha256
        - name: onion-gen-darwin-arm64
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/onion-gen/$VERSION/onion-gen-darwin-arm64
        - name: onion-gen-darwin-arm64.sha256
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/onion-gen/$VERSION/onion-gen-darwin-arm64.sha256
        - name: onion-gen-windows-amd64.exe
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/onion-gen/$VERSION/onion-gen-windows-amd64.exe
        - name: onion-gen-windows-amd64.exe.sha256
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/onion-gen/$VERSION/onion-gen-windows-amd64.exe.sha256
        - name: onion-gen-windows-arm64.exe
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/onion-gen/$VERSION/onion-gen-windows-arm64.exe
        - name: onion-gen-windows-arm64.exe.sha256
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/onion-gen/$VERSION/onion-gen-windows-arm64.exe.sha256
        - name: SHA256SUMS
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/onion-gen/$VERSION/SHA256SUMS
