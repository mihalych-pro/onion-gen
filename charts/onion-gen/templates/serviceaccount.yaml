{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "onion-gen.serviceAccountName" . }}
  labels:
    {{- include "onion-gen.labels" . | nindent 4 }}
# No roles and no bindings: neither role talks to the API server. The account
# exists so the pods are not running as `default`, which usually has more.
automountServiceAccountToken: false
{{- end }}
