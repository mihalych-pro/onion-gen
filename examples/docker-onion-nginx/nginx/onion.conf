server {
    listen 8080;
    # Substitute your own address; _ accepts any Host, convenient for an example.
    server_name _;

    root /var/www/onion;
    index index.html;

    # TLS is unnecessary here: the connection is already encrypted and
    # authenticated by the onion service protocol, and the address is the key.

    # A separate log: mixing onion traffic with clearnet means linking the two
    # services together.
    access_log /var/log/nginx/onion.access.log;

    location / {
        try_files $uri $uri/ =404;
    }
}
